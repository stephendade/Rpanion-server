name: Build Debian Package

on: [push, pull_request, workflow_dispatch]

jobs:
    build:
        runs-on: ${{ matrix.runs-on }}
        strategy:
          matrix:
            include:
              - arch: amd64
                runs-on: ubuntu-latest
              - arch: arm64
                runs-on: ubuntu-24.04-arm
        steps:
        - uses: actions/checkout@v7

        - name: Install packages
          run: |
            cd ./deploy && ./install_common_libraries.sh
            sudo apt install -y lintian
            
        # Inject NodeSource Node.js 24 via apt, to ensure "sudo apt install rpanion-server" works
        - name: Inject NodeSource Node.js 24 into apt
          run: |
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo bash -
            sudo apt install -y nodejs

        - name: Install dependencies
          run: npm ci

        - name: Insert architecture into package.json
          run: |
            # Update package.json with the architecture
            jq --arg arch "${{ matrix.arch }}" '.node_deb.architecture = $arch' package.json > tmp.json && mv tmp.json package.json

        - name: Download pre-built mavlink-router
          run: |
            mkdir -p ./additional/usr/share/rpanion-server/app/
            
            # Set the mavlink-router version to download
            MAVLINK_ROUTER_VERSION="4"
            
            # Download the appropriate binary based on architecture
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              echo "Downloading mavlink-router for ARM64"
              wget -O ./additional/usr/share/rpanion-server/app/mavlink-routerd \
                "https://github.com/mavlink-router/mavlink-router/releases/download/v${MAVLINK_ROUTER_VERSION}/mavlink-routerd-glibc-aarch64" 
            else
              echo "Downloading mavlink-router for AMD64"
              wget -O ./additional/usr/share/rpanion-server/app/mavlink-routerd \
                "https://github.com/mavlink-router/mavlink-router/releases/download/v${MAVLINK_ROUTER_VERSION}/mavlink-routerd-glibc-x86_64"
            fi
            
            # Make the binary executable
            chmod +x ./additional/usr/share/rpanion-server/app/mavlink-routerd
            
            # Verify the downloaded binary
            file ./additional/usr/share/rpanion-server/app/mavlink-routerd

        - name: Add dev suffix to version is this is running for a PR
          if: github.event_name == 'pull_request'
          run: |
            jq '.version = (.version + "-dev")' package.json > tmp.json && mv tmp.json package.json

        - name: Vite build
          run: npm run build

        - name: Remove dev dependencies (keeping node-deb for packaging)
          run: |
            NODE_DEB_VERSION=$(node -p "require('./package.json').devDependencies['node-deb']")
            npm install -g "node-deb@${NODE_DEB_VERSION}"
            npm prune --production

        - name: Build package
          run: npm run package

        - name: Repackage using xz for earlier Debian versions
          run: |
            for file in rpanion-server_*.deb; do
              dpkg-deb -R "$file" temp_dir
              dpkg-deb -bZxz temp_dir "${file%.deb}.xz"
              rm -rf temp_dir
              rm -rf "$file"
              mv "${file%.deb}.xz" "$file"
            done

        - name: Check package with lintian
          run: |
            for file in rpanion-server_*.deb; do
              lintian -i --fail-on error --suppress-tags arch-dependent-file-in-usr-share,binary-from-other-architecture,library-not-linked-against-libc,missing-dependency-on-libc,package-contains-eslint-config-file,package-contains-npm-ignore-file,wrong-file-owner-uid-or-gid,unusual-interpreter,script-not-executable,executable-not-elf-or-script,embedded-javascript-library,privacy-breach-generic,recursive-privilege-change,package-contains-vcs-control-file,shell-script-fails-syntax-check,no-changelog,malformed-contact,maintainer-script-lacks-home-in-adduser,extended-description-is-empty,unknown-section,synopsis-too-long,no-manual-page,maintainer-script-calls-systemctl,unstripped-binary-or-object,absolute-symlink-in-top-level-folder,no-copyright-file "$file"
            done


        - name: Install deb
          run: |
            for file in rpanion-server_*.deb; do
              sudo apt install -y ./"$file"
            done

        - name: Archive build
          uses: actions/upload-artifact@v7
          with:
            name: rpanion-server-${{ matrix.arch }}.deb
            path: 'rpanion-server_*.deb'
            retention-days: 7
    deploy:
      if: github.event_name != 'pull_request'
      needs: build  # This ensures deploy only runs after all matrix builds complete
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Download all artifacts
          uses: actions/download-artifact@v8
          with:
            path: artifacts/
        - name: Release
          uses: "softprops/action-gh-release@v3"
          if: startsWith(github.ref, 'refs/tags/v')
          with:
            prerelease: false
            files: |
              artifacts/rpanion-server-amd64.deb/rpanion-server_*.deb
              artifacts/rpanion-server-arm64.deb/rpanion-server_*.deb
            token: "${{ secrets.GITHUB_TOKEN }}"
        - name: Delete existing pre-release
          if: github.ref == 'refs/heads/master'
          run: |
            gh release delete latest --yes || true
            git push origin :refs/tags/latest || true
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Create latest pre-release
          if: github.ref == 'refs/heads/master'
          uses: "softprops/action-gh-release@v3"
          with:
            tag_name: latest
            name: "Latest Build (master)"
            prerelease: true
            target_commitish: ${{ github.sha }} 
            body: |
              This is an automated pre-release of the latest successful build from the `master` branch.

              **Commit:** ${{ github.sha }}
              **Built:** ${{ github.run_id }}

              > This release is updated on every push to master and is not a stable release.
            files: |
              artifacts/rpanion-server-amd64.deb/rpanion-server_*.deb
              artifacts/rpanion-server-arm64.deb/rpanion-server_*.deb
            token: "${{ secrets.GITHUB_TOKEN }}"

